name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install optional dependencies (mcp, pinecone, openai)
        run: pip install -r requirements-optional.txt

      - name: Deployment readiness check (critical deps installed)
        run: python scripts/check_deployment_readiness.py

      - name: Lint with ruff
        run: python -m ruff check .claude/skills/tailor-resume/scripts/ tests/

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Coverage report
        run: python -m pytest tests/ --cov=".claude/skills/tailor-resume/scripts" --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=86

  test-web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install core + web backend dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -r web_app/backend/requirements.txt

      - name: Run web backend tests
        run: |
          PYTHONPATH=web_app/backend python -m pytest \
            tests/test_billing.py \
            tests/test_web_api.py \
            tests/test_api_server.py \
            tests/test_setup_routes.py \
            tests/test_profile_patch.py \
            tests/test_mcp_server.py \
            -v --tb=short
        env:
          ENVIRONMENT: test
          CLERK_PEM_KEY: ""
          SUPABASE_URL: ""
          STRIPE_SECRET_KEY: ""
